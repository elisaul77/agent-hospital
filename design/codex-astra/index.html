<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guardia nocturna · Hospital de agentes</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#101b30;color:#e2e1ca;font:20px 'VT323',monospace;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;cursor:grab;touch-action:none}canvas:active{cursor:grabbing}.hud{position:fixed;background:#142332ed;border:2px solid #405a63;box-shadow:4px 4px 0 #080f1b;padding:12px 18px}header{left:24px;top:22px;display:flex;align-items:center;gap:25px}h1{font:28px 'VT323',monospace;letter-spacing:2px;margin:0;color:#ffda91}small{font-size:16px;color:#92a7b3}.dot{color:#98d9ad}button,select{font:18px 'VT323',monospace;color:#dbe7dc;background:#263c49;border:1px solid #55717b;padding:6px 10px;cursor:pointer}button:hover,button:focus-visible{background:#48616b}nav{right:24px;top:22px;display:flex;gap:8px;align-items:center}footer{bottom:22px;left:24px;right:24px;display:flex;justify-content:space-between;gap:16px}.legend{color:#b6cacd}#status{color:#e7bd77}#inspector{right:24px;bottom:88px;width:250px;display:none}#inspector.open{display:block}#cases{margin:8px 0;padding:0;list-style:none;font-size:17px}#cases li{padding:8px 0;border-top:1px solid #39505c}#log{color:#9fbbc5;font-size:17px}#session{max-width:140px} @media(max-width:780px){header{left:10px;top:10px;padding:8px}h1{font-size:21px}header small{display:none}nav{top:72px;left:10px;right:auto;padding:6px}footer{left:10px;right:10px;bottom:10px;font-size:16px}.legend{display:none}}
</style>
<canvas id="world" aria-label="Hospital de agentes: arrastra para mover el mapa y usa los controles para ampliar"></canvas>
<header class="hud"><div><h1>HOSPITAL DE AGENTES</h1><small>GUARDIA NOCTURNA / 02:47 AM</small></div><div><span class="dot">●</span> <span id="count">0 agentes</span><br><small id="status">SIMULACIÓN LOCAL</small></div></header>
<nav class="hud" aria-label="Controles del mapa"><select id="mode" aria-label="Fuente"><option value="local">Simulación</option><option value="demo">Demo SSE</option><option value="live">En vivo</option></select><input id="session" placeholder="sesión (opcional)" aria-label="Sesión SSE" hidden><button id="minus" aria-label="Alejar">−</button><span id="zoom">100%</span><button id="plus" aria-label="Acercar">+</button><button id="reset">Centrar</button><button id="details" aria-expanded="false">Casos</button></nav>
<aside class="hud" id="inspector"><span>PARTE DE GUARDIA</span><ul id="cases"></ul><div id="log"></div></aside>
<footer class="hud"><span><span class="dot">◆</span> TURNO 03 <span id="activity">· equipo en servicio</span></span><span class="legend">◇ expediente / hilos = revisión pendiente</span><small>ARRASTRAR · RUEDA PARA ZOOM</small></footer>
<script type="module" src="./js/main.js"></script></html>
